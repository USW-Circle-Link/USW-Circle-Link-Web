name: Deploy to GitHub Pages

on:
  push:
    branches: [ test ]   # 배포 트리거 브랜치
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build    # 산출물: dist/

      # Vue SPA 라우팅 404 대응
      - run: cp docs/index.html docs/404.html

      # 커스텀 도메인을 Pages 설정에서 이미 지정했다면 생략 가능
      # - run: echo "admin.donggurami.net" > dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
